services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: teamtasks
      POSTGRES_PASSWORD: teamtasks
      POSTGRES_DB: teamtasks
      ports:
        - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U teamtasks"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
